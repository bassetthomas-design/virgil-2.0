name: Build Virgil 2.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Virgil.sln

      - name: Build
        run: dotnet build Virgil.sln --configuration Release --no-restore

      - name: Publish app
        run: dotnet publish src/Virgil.App/Virgil.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Virgil2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virgil-2.0-win-x64
          path: artifacts/Virgil2
