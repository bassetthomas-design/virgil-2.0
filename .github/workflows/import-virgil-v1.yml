name: Import Virgil v1 into Virgil 2.0

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository to import"
        required: true
        default: "https://github.com/bassetthomas-design/Virgil.git"
      target_branch:
        description: "Branch to create/update"
        required: true
        default: "virgil-2-tactical-hud"

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    name: Import Virgil v1
    runs-on: windows-latest

    steps:
      - name: Checkout Virgil 2.0
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare target branch
        shell: pwsh
        run: |
          git checkout -B "${{ github.event.inputs.target_branch }}"

      - name: Backup Virgil 2.0 files
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP "virgil2-backup"
          New-Item -ItemType Directory -Force -Path $backup | Out-Null

          $paths = @(
            "README.md",
            "PROJECT_STATUS.md",
            "docs",
            "scripts",
            "src\Virgil.App\Themes\TacticalHudTheme.xaml",
            ".github\workflows\import-virgil-v1.yml"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $destination = Join-Path $backup $path
              $destinationParent = Split-Path -Parent $destination
              if ($destinationParent -and -not (Test-Path $destinationParent)) {
                New-Item -ItemType Directory -Force -Path $destinationParent | Out-Null
              }
              Copy-Item -LiteralPath $path -Destination $destination -Recurse -Force
            }
          }

      - name: Clone Virgil v1 source
        shell: pwsh
        run: |
          $source = "${{ github.event.inputs.source_repo }}"
          $sourceDir = Join-Path $env:RUNNER_TEMP "virgil-v1-source"
          git clone --depth 1 $source $sourceDir

      - name: Replace repository content with Virgil v1 base
        shell: pwsh
        run: |
          Get-ChildItem -Force | Where-Object { $_.Name -ne ".git" } | Remove-Item -Recurse -Force

          $sourceDir = Join-Path $env:RUNNER_TEMP "virgil-v1-source"
          robocopy $sourceDir . /E /XD ".git" | Out-Host
          if ($LASTEXITCODE -gt 7) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }
          exit 0

      - name: Restore Virgil 2.0 overlay
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP "virgil2-backup"

          $paths = @(
            "README.md",
            "PROJECT_STATUS.md",
            "docs",
            "scripts",
            "src\Virgil.App\Themes\TacticalHudTheme.xaml",
            ".github\workflows\import-virgil-v1.yml"
          )

          foreach ($path in $paths) {
            $source = Join-Path $backup $path
            if (Test-Path $source) {
              $destinationParent = Split-Path -Parent $path
              if ($destinationParent -and -not (Test-Path $destinationParent)) {
                New-Item -ItemType Directory -Force -Path $destinationParent | Out-Null
              }
              Copy-Item -LiteralPath $source -Destination $path -Recurse -Force
            }
          }

      - name: Add Virgil 2.0 integration note
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "docs" | Out-Null
          @'
          # Import Virgil v1

          Import automatique effectué par GitHub Actions.

          Branche cible : `virgil-2-tactical-hud`

          Après import :

          1. vérifier `dotnet restore`
          2. vérifier `dotnet build`
          3. intégrer `src/Virgil.App/Themes/TacticalHudTheme.xaml` dans `App.xaml`
          4. corriger les métriques RAM
          5. préparer le publish self-contained
          '@ | Set-Content -Encoding UTF8 "docs\IMPORT_STATUS.md"

      - name: Commit imported base
        shell: pwsh
        run: |
          git status --short
          git add .
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit."
          } else {
            git commit -m "feat: import Virgil v1 base into Virgil 2.0"
          }

      - name: Push branch
        shell: pwsh
        run: |
          git push --force-with-lease origin "${{ github.event.inputs.target_branch }}"
