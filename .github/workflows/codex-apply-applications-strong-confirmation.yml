name: Codex Apply Applications Strong Confirmation Payload

on:
  push:
    branches:
      - fix/applications-strong-uninstall-confirmation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'codex-seed-applications-strong-confirmation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/applications-strong-uninstall-confirmation
          fetch-depth: 0
      - name: Apply Codex payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/codex-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/codex-payload.b64 > /tmp/codex-payload.zip
          git fetch origin main
          git checkout -B fix/applications-strong-uninstall-confirmation origin/main
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('/tmp/codex-payload.zip') as archive:
              for info in archive.infolist():
                  name = info.filename.replace('\\', '/')
                  parts = pathlib.PurePosixPath(name).parts
                  if name.startswith('/') or '..' in parts:
                      raise SystemExit(f'Unsafe archive member: {info.filename}')
              archive.extractall(root)
          PY
          git config user.name "codex-app[bot]"
          git config user.email "codex-app[bot]@users.noreply.github.com"
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "fix(applications): enforce strong uninstall confirmation"
          git push --force-with-lease=refs/heads/fix/applications-strong-uninstall-confirmation:${GITHUB_SHA} origin HEAD:refs/heads/fix/applications-strong-uninstall-confirmation
