name: Release Virgil

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Virgil.sln

      - name: Build
        run: dotnet build Virgil.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Virgil.sln --configuration Release --no-build

      - name: Release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./installer/Get-ReleaseVersion.ps1
          $publication = Get-ReleasePublication $env:RELEASE_TAG
          "version=$($publication.Version)" >> $env:GITHUB_OUTPUT

      - name: Publish app
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/Virgil.App/Virgil.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Virgil2 -p:Version=$env:APP_VERSION -p:InformationalVersion=$env:APP_VERSION -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/Build-Installer.ps1 -AppVersion $env:APP_VERSION

      - name: SHA-256 and prerelease
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "artifacts/installer/Virgil-$env:APP_VERSION-win-x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256" -Encoding ascii
          . ./installer/Get-ReleaseVersion.ps1
          $publication = Get-ReleasePublication $env:RELEASE_TAG
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $setup, "$setup.sha256", '--verify-tag', '--title', "Virgil $env:APP_VERSION", '--notes-file', $publication.NotesFile)
          if ($publication.IsPrerelease) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Création de la release en échec.' }
